<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Blueprint | Vedic Astrology</title>
    <style>
        /* Midnight Cosmic Theme Styling */
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121e;
            --cosmic-glow: #3a2d54;
            --gold-accent: #d4af37;
            --text-main: #f0f0f5;
            --text-muted: #a0a0b0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1rem 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Form Styling */
        .form-card {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gold-accent);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2c1b4d 0%, #1a0f30 100%);
            border: 1px solid var(--gold-accent);
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, var(--gold-accent) 0%, #b8972f 100%);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Chart Preview Styling */
        .chart-card {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
        }

        /* Dynamic North Indian Diamond Chart Base */
        .north-chart {
            width: 300px;
            height: 300px;
            position: relative;
            border: 2px solid var(--gold-accent);
            box-shadow: 0 0 20px rgba(58, 45, 84, 0.5);
        }

        /* SVG lines for the classic diamond layout */
        .chart-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>COSMIC BLUEPRINT</h1>
        <p>Discover your unique Vedic alignment and chart paths.</p>
    </header>

    <div class="container">
        <!-- Left Side: Data Input -->
        <div class="form-card">
            <h2 style="margin-top:0; color:#fff;">Enter Birth Details</h2>
            <form id="astrologyForm">
                <div class="form-group">
                    <label for="name">NAME</label>
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="date">BIRTH DATE</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">EXACT TIME</label>
                    <input type="time" id="time" required>
                </div>
                <div class="form-group">
                    <label for="location">BIRTH PLACE</label>
                    <input type="text" id="location" placeholder="City, State/Country" required>
                </div>
                <button type="submit">GENERATE BLUEPRINT</button>
            </form>
        </div>

        <!-- Right Side: Chart Result Visualizer -->
        <div class="chart-card">
            <div class="north-chart" id="chartContainer">
                <!-- North Indian Geometric Web -->
                <svg class="chart-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- Diagonal Lines to form the main diamonds -->
                    <line x1="0" y1="0" x2="100" y2="100" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
                    <line x1="100" y1="0" x2="0" y2="100" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
                    <!-- Inner diamond points connecting midpoints -->
                    <line x1="50" y1="0" x2="0" y2="50" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
                    <line x1="0" y1="50" x2="50" y2="100" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
                    <line x1="50" y1="100" x2="100" y2="50" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
                    <line x1="100" y1="50" x2="50" y2="0" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
                </svg>
            </div>
            <p class="placeholder-text" id="statusText">Submit details above to calculate the North Indian chart layout.</p>
        </div>
    </div>

    <script>
        // Form submission behavior logic placeholder
        document.getElementById('astrologyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('statusText').innerText = "Connecting to the cosmos... Generating your unique blueprint handler.";
            document.getElementById('statusText').style.color = "#d4af37";
            // Next step: Hooking up the calculation engine here!
        });
    </script>
</body>
</html>
